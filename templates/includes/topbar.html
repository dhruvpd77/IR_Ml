<header class="topbar">
  <button class="menu-btn" id="menuBtn" type="button" aria-label="Open menu"><i data-lucide="menu"></i></button>
  <form class="top-search" action="{% url 'machines:list' %}" method="get">
    <input type="search" name="q" value="{{ request.GET.q }}" placeholder="Search machine ID, work order, CCN, model, or serial">
  </form>
  <div class="top-tools">
    {% if request.user.is_authenticated %}
    <a class="icon-btn" href="{% url 'notifications:list' %}" aria-label="Notifications">
      <i data-lucide="bell"></i>
      <span id="unreadBadge" class="bell-count" {% if not unread_notifications %}hidden{% endif %}>{{ unread_notifications }}</span>
    </a>
    <form id="logout-form" method="post" action="{% url 'accounts:logout' %}">{% csrf_token %}</form>
    <details class="user-menu">
      <summary>
        <span class="avatar">{{ request.user.display_name|slice:":1"|upper }}</span>
        <span>{{ request.user.display_name }}<br><small class="muted">{{ request.user.role_label }}</small></span>
      </summary>
      <div class="user-menu-panel">
        <a href="{% url 'accounts:profile' %}">Profile</a>
        <a href="{% url 'accounts:password' %}">Change password</a>
        <button type="submit" form="logout-form" formnovalidate>Sign out</button>
      </div>
    </details>
    {% else %}
      <a class="btn-primary" href="{% url 'accounts:login' %}">Sign in</a>
    {% endif %}
  </div>
</header>
