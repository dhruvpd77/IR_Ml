<aside class="sidebar">
  <div class="brand">
    <div class="brand-mark">IR</div>
    <div>
      <small>Ingersoll Rand</small>
      <strong>Production ROTARY</strong>
    </div>
  </div>
  <nav class="nav-scroll">
    {% for item in nav_items %}
      <a class="nav-link{% if item.active %} active{% endif %}" href="{{ item.href }}">
        <i data-lucide="{{ item.icon }}"></i>
        <span>{{ item.label }}</span>
        {% if item.count %}
          <span class="nav-count" aria-label="{{ item.count }} open">{{ item.count }}</span>
        {% endif %}
      </a>
    {% endfor %}
  </nav>
  <div class="sidebar-foot">One machine · one record · full traceability</div>
</aside>
